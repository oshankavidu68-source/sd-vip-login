var cv=document.getElementById("bg3d"),cx=cv.getContext("2d"),w,h,stars=[],ang=0,gOff=0;
function rs(){w=cv.width=window.innerWidth;h=cv.height=window.innerHeight;}
window.onresize=rs;rs();
var cols=["#ff0055","#ffd700","#00e5ff","#ff5500"];
for(var i=0;i<160;i++)stars.push({x:(Math.random()-.5)*w*2.5,y:(Math.random()-.5)*h*2.5,z:Math.random()*1000,c:cols[i%4]});
function draw3D(){
  cx.fillStyle="rgba(2,2,6,0.3)";cx.fillRect(0,0,w,h);
  gOff=(gOff+3)%45;ang+=0.018;
  cx.strokeStyle="rgba(255,0,85,0.45)";cx.lineWidth=1.5;
  for(var x=-w;x<w*2;x+=55){cx.beginPath();cx.moveTo(w/2+(x-w/2)*0.05,h/2);cx.lineTo(x,h);cx.stroke();}
  for(var y=0;y<h/2;y+=28){var py=h/2+Math.pow((y+gOff)/(h/2),2.1)*(h/2);cx.beginPath();cx.moveTo(0,py);cx.lineTo(w,py);cx.stroke();}
  for(var r=0;r<3;r++){
    cx.save();cx.translate(w/2,h/2);cx.rotate(ang*(r%2?1:-1.4)+r);
    cx.strokeStyle=r===0?"rgba(0,229,255,0.55)":(r===1?"rgba(255,0,85,0.55)":"rgba(255,215,0,0.45)");
    cx.lineWidth=2.5;var rad=140+r*52;
    cx.beginPath();for(var k=0;k<6;k++){var a=k*Math.PI/3;cx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);}
    cx.closePath();cx.stroke();cx.restore();
  }
  for(var i=0;i<stars.length;i++){
    var s=stars[i];s.z-=9;if(s.z<=1){s.z=1000;s.x=(Math.random()-.5)*w*2.5;s.y=(Math.random()-.5)*h*2.5;}
    var sx=(s.x/s.z)*320+w/2,sy=(s.y/s.z)*320+h/2,sz=(1-s.z/1000)*5;
    cx.fillStyle=s.c;cx.beginPath();cx.arc(sx,sy,sz,0,Math.PI*2);cx.fill();
  }
  requestAnimationFrame(draw3D);
}
